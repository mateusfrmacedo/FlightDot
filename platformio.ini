[platformio]
default_envs = radar

[env]
lib_deps = lvgl/lvgl@8.4.0
build_flags = -DLV_CONF_INCLUDE_SIMPLE -Iinclude -std=gnu++17
build_unflags = -std=gnu++11

[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.embed_files =
    certs/x509_crt_bundle
    data/airports.json.gz
board_build.embed_txtfiles = certs/gts-root-r4.pem
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<sim_main.cpp>
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = ${env.lib_deps}
    bblanchon/ArduinoJson@6.21.5

[env:radar]
extends = esp32

[env:display-test]
extends = esp32
build_flags = ${esp32.build_flags} -DPLANO_DISPLAY_TEST=1
build_src_filter = -<*> +<main.cpp> +<hardware/display.cpp> +<hardware/touch.cpp>

[env:mock]
extends = esp32
build_flags = ${esp32.build_flags} -DPLANO_MOCK=1

[env:native]
platform = native
build_src_filter = -<*> +<core/model.cpp> +<core/mock.cpp> +<core/places.cpp> +<ui/> +<sim_main.cpp>
build_flags =
    ${env.build_flags}
    !sdl2-config --cflags --libs

[env:test-native]
platform = native
lib_deps = bblanchon/ArduinoJson@6.21.5
build_flags = -std=gnu++17 -Isrc -Iinclude
build_src_filter = -<*> +<core/model.cpp> +<core/parser.cpp> +<core/mock.cpp> +<core/places.cpp>
test_build_src = yes
